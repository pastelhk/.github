name: Code Scan

concurrency:
  group: code-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      run-packages:
        description: 'Run package.json check (npm run check:packages)'
        type: boolean
        default: true
      run-format:
        description: 'Run format check (npm run check:format)'
        type: boolean
        default: true
      run-types:
        description: 'Run type check (npm run check:types)'
        type: boolean
        default: true
      run-lint:
        description: 'Run lint check (npm run check:lint)'
        type: boolean
        default: true
      run-tests:
        description: 'Run tests (npm run check:test)'
        type: boolean
        default: true
      run-audit:
        description: 'Run npm audit'
        type: boolean
        default: true
      run-sonar:
        description: 'Run SonarQube scan'
        type: boolean
        default: true
      run-hoisting:
        description: 'Verify package hoisting in workspaces'
        type: boolean
        default: true
      pr-comment:
        description: 'Post/update the sticky PR comment (needs pull-requests: write on the caller job)'
        type: boolean
        default: true
      report:
        description: >
          Render the results and own the `Code Scan` check. Set false when the caller adds its own jobs
          and reports through code-scan-report.yml, passing this workflow's `results` output.
        type: boolean
        default: true
      timeout:
        description: 'Timeout in minutes for the entire job'
        type: number
        default: 12
      extra-install-cache-paths:
        description: >
          Newline-separated paths to cache alongside node_modules. A cache hit skips
          postinstall/prepare, so list anything those produce outside node_modules here.
        type: string
        default: ''
      runs-on:
        description: >
          Runner label for the checks and sonar jobs, e.g. 'ubuntu-24.04-arm' for the
          cheaper/faster arm64 runner. Default keeps every existing caller unchanged;
          opt in only after confirming your workspace's native deps (Prisma engines,
          swc/esbuild/etc.) and Sonar findings are unaffected on arm64.
        type: string
        default: 'ubuntu-latest'
    outputs:
      results:
        description: 'JSON array of { name, outcome, isWarning?, optional? }, the input shape of code-scan-report.yml'
        value: ${{ jobs.report.outputs.results }}
    secrets:
      SONAR_TOKEN:
        required: false
      PRIVATE_NPM_REGISTRY_PASSWORD:
        required: false

jobs:
  checks:
    name: Checks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout }}

    permissions:
      contents: read
      checks: write
      pull-requests: write

    # The action's own outcome wins: it says `skipped` for hoisting outside a workspace and for
    # dependabot's audit, and keeps audit's `failure` (a warning, so the step itself passes).
    outputs:
      lockfile: ${{ steps.check-lockfile.outputs.outcome || steps.check-lockfile.outcome }}
      audit: ${{ steps.check-audit.outputs.outcome || steps.check-audit.outcome }}
      packages: ${{ steps.check-packages.outputs.outcome || steps.check-packages.outcome }}
      hoisting: ${{ steps.check-hoisting.outputs.outcome || steps.check-hoisting.outcome }}
      is-workspace: ${{ steps.check-hoisting.outputs.is-workspace }}
      format: ${{ steps.check-format.outputs.outcome || steps.check-format.outcome }}
      types: ${{ steps.check-types.outputs.outcome || steps.check-types.outcome }}
      lint: ${{ steps.check-lint.outputs.outcome || steps.check-lint.outcome }}
      tests: ${{ steps.check-test.outputs.outcome || steps.check-test.outcome }}

    steps:
      - name: Post pending comment
        if: ${{ github.event_name == 'pull_request' && inputs.pr-comment }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_COMMENT: ${{ inputs.pr-comment }}
        with:
          script: |
            const MARKER = '<!-- code-scan-report -->';
            const LOG_START = '<!-- log-start -->';
            const LOG_END = '<!-- log-end -->';

            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const shortSha = sha.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startedAt = new Date().toLocaleString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false }) + ' HKT';

            const runningBlock =
              `## 📋 Code Scan Results\n\n⏳ **Running…** — [#${context.runNumber}](${runUrl})` +
              `\n\n<sub>Commit [\`${shortSha}\`](${commitUrl}) · Started ${startedAt}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(MARKER));

            // carry prior run-log rows forward untouched (no new line yet — run isn't done)
            let logBlock = '';
            if (existing) {
              const s = existing.body.indexOf(LOG_START), e = existing.body.indexOf(LOG_END);
              if (s >= 0 && e > s) {
                const lines = existing.body.slice(s + LOG_START.length, e)
                  .split('\n').map(l => l.trim())
                  .filter(l => l.startsWith('|') && !l.startsWith('|--') && !l.startsWith('| Result |'));
                if (lines.length) {
                  logBlock =
                    `\n\n<details><summary>📜 Run log (${lines.length})</summary>\n\n` +
                    `${LOG_START}\n\n| Result | Run | Commit | When |\n|--|--|--|--|\n` +
                    `${lines.join('\n')}\n\n${LOG_END}\n\n</details>`;
                }
              }
            }

            const body = `${MARKER}\n${runningBlock}${logBlock}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Set up
        uses: pastelhk/.github/.github/actions/code-scan-setup@feat/code-scan-composable-checks
        with:
          extra-install-cache-paths: ${{ inputs.extra-install-cache-paths }}
          registry-url: ${{ vars.PRIVATE_NPM_REGISTRY_URL }}
          registry-username: ${{ vars.PRIVATE_NPM_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.PRIVATE_NPM_REGISTRY_PASSWORD }}

      # No continue-on-error: a drifted lockfile stops the job, as before.
      - name: Check lock file clean
        id: check-lockfile
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: lockfile

      - name: Verify hoisting
        id: check-hoisting
        if: inputs.run-hoisting
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: hoisting
        continue-on-error: true

      - name: Check for vulnerabilities in dependencies
        id: check-audit
        if: inputs.run-audit && github.actor != 'dependabot[bot]'
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: audit
        continue-on-error: true

      - name: Check package.json
        id: check-packages
        if: inputs.run-packages
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: packages
        continue-on-error: true

      - name: Check Format
        id: check-format
        if: inputs.run-format
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: format
        continue-on-error: true

      - name: Check Type
        id: check-types
        if: inputs.run-types
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: types
        continue-on-error: true

      - name: Check Lint
        id: check-lint
        if: inputs.run-lint
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: lint
        continue-on-error: true

      - name: Run Tests
        id: check-test
        if: inputs.run-tests
        uses: pastelhk/.github/.github/actions/code-scan-run@feat/code-scan-composable-checks
        with:
          checks: tests
        continue-on-error: true

      - name: Test Report
        if: '!cancelled() && inputs.run-tests && github.event.pull_request.head.repo.full_name == github.repository'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Tests
          path: '**/__test-results__/**/*.xml'
          reporter: jest-junit
          fail-on-empty: false

  sonar:
    name: SonarQube
    if: inputs.run-sonar
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout }}

    permissions:
      contents: read

    outputs:
      sonar: ${{ steps.check-sonarqube.outcome }}

    steps:
      # SonarQube's new-code/blame analysis needs full history, and SonarJS's type-aware
      # rules resolve imports through node_modules, so this needs a real install too.
      - name: Set up
        uses: pastelhk/.github/.github/actions/code-scan-setup@feat/code-scan-composable-checks
        with:
          fetch-depth: 0
          extra-install-cache-paths: ${{ inputs.extra-install-cache-paths }}
          registry-url: ${{ vars.PRIVATE_NPM_REGISTRY_URL }}
          registry-username: ${{ vars.PRIVATE_NPM_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.PRIVATE_NPM_REGISTRY_PASSWORD }}

      - name: SonarQube Scan
        id: check-sonarqube
        uses: pastelhk/.github/.github/actions/code-scan-sonar@feat/code-scan-composable-checks
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          project-key: ${{ vars.SONAR_PROJECT_KEY }}
        continue-on-error: true

  report:
    # With report: false this job only collects; the caller's code-scan-report.yml job owns `Code Scan`.
    name: ${{ inputs.report && 'Code Scan' || 'Collect results' }}
    needs: [checks, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    outputs:
      results: ${{ steps.collect.outputs.results }}

    steps:
      # Step-level guard only — whether this job gets scheduled at all after an
      # upstream cancellation is the open item noted in the PR description.
      - name: Collect results
        id: collect
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          SONAR_RESULT: ${{ needs.sonar.result }}
        with:
          script: |
            // needs.sonar.outputs.sonar is 'skipped' when the sonar job died before its
            // scan step ran (e.g. install failed) — fall back to the job result so that
            // shows as a failure instead of a misleading skip.
            const sonarStepOutcome = '${{ needs.sonar.outputs.sonar }}';
            const sonarOutcome =
              sonarStepOutcome === 'skipped' && process.env.SONAR_RESULT === 'failure'
                ? 'failure'
                : sonarStepOutcome || process.env.SONAR_RESULT;

            const checks = [
              { name: 'Lock file', outcome: '${{ needs.checks.outputs.lockfile }}' },
              { name: 'Audit', outcome: '${{ needs.checks.outputs.audit }}', isWarning: true, optional: true },
              { name: 'Package.json', outcome: '${{ needs.checks.outputs.packages }}', optional: ${{ !inputs.run-packages }} },
              { name: 'Hoisting', outcome: '${{ needs.checks.outputs.hoisting }}', optional: ${{ !inputs.run-hoisting || needs.checks.outputs.is-workspace != 'true' }} },
              { name: 'Format', outcome: '${{ needs.checks.outputs.format }}', optional: ${{ !inputs.run-format }} },
              { name: 'Types', outcome: '${{ needs.checks.outputs.types }}', optional: ${{ !inputs.run-types }} },
              { name: 'Lint', outcome: '${{ needs.checks.outputs.lint }}', optional: ${{ !inputs.run-lint }} },
              { name: 'Tests', outcome: '${{ needs.checks.outputs.tests }}', optional: ${{ !inputs.run-tests }} },
              { name: 'SonarQube', outcome: sonarOutcome, isWarning: true, optional: ${{ !inputs.run-sonar }} },
            ];
            core.setOutput('results', JSON.stringify(checks));

      # Runs on cancel too, so the action can mark the banner cancelled.
      - name: Report
        if: ${{ always() && inputs.report }}
        uses: pastelhk/.github/.github/actions/code-scan-report@feat/code-scan-composable-checks
        with:
          results: ${{ steps.collect.outputs.results }}
          jobs: '{"checks":{"result":"${{ needs.checks.result }}"}}'
          pr-comment: ${{ inputs.pr-comment }}
