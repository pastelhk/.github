name: Code Scan Setup
description: Check out, initialise npm and install dependencies with the shared node_modules cache

inputs:
  fetch-depth:
    description: 'Checkout depth; SonarQube needs 0 (full history)'
    required: false
    default: '1'
  extra-install-cache-paths:
    description: >
      Newline-separated paths to cache alongside node_modules. A cache hit skips
      postinstall/prepare, so list anything those produce outside node_modules here.
    required: false
    default: ''
  registry-url:
    description: 'Private npm registry URL (vars.PRIVATE_NPM_REGISTRY_URL)'
    required: false
    default: ''
  registry-username:
    description: 'Private npm registry username (vars.PRIVATE_NPM_REGISTRY_USERNAME)'
    required: false
    default: ''
  registry-password:
    description: 'Private npm registry password (secrets.PRIVATE_NPM_REGISTRY_PASSWORD)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: pastelhk/.github/.github/actions/npm-init@v1
      with:
        restore-packages: false
        package-cache: 'false'
        registry-url: ${{ inputs.registry-url }}
        registry-username: ${{ inputs.registry-username }}
        registry-password: ${{ inputs.registry-password }}

    # Lockfile + Node version + arch key (no sha — wants a hit across commits).
    # .nvmrc is in the key so a Node bump alone still misses: some native deps are Node-ABI-specific.
    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          ${{ inputs.extra-install-cache-paths }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('package-lock.json', 'patches/**', '.nvmrc') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node-modules-

    # Intentionally use `npm install` instead of `npm ci` to detect updates to lock file
    - name: Install dependencies
      shell: bash
      run: npm install
