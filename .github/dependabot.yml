version: 2

# NOTE: These secrets are resolved from Dependabot secrets, not Actions secrets,
# and must be configured separately at org/repository level.
registries:
  pastel-npm:
    type: npm-registry
    url: https://npm.pastel.dev
    username: ${{ secrets.PRIVATE_NPM_REGISTRY_USERNAME }}
    password: ${{ secrets.PRIVATE_NPM_REGISTRY_PASSWORD }}

updates:
  # ---- npm (this repo) ----
  - package-ecosystem: 'npm'
    directory: '/'
    registries:
      - pastel-npm
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Hong_Kong'
    open-pull-requests-limit: 10
    labels: ['dependencies']

  # ---- GitHub Actions (workflows) ----
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Asia/Hong_Kong'
      time: '09:30'
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
    labels: ['dependencies', 'ci']
