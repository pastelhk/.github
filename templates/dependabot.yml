version: 2

registries:
  pastel-npm:
    type: npm-registry
    url: https://npm.pastel.dev
    username: ${{ secrets.PRIVATE_NPM_REGISTRY_USERNAME }}
    password: ${{ secrets.PRIVATE_NPM_REGISTRY_PASSWORD }}

updates:
  # ---- npm (root lockfile covers the whole workspace) ----
  - package-ecosystem: 'npm'
    directory: '/'
    registries:
      - pastel-npm
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Hong_Kong'
    open-pull-requests-limit: 10
    labels: ['dependencies']

  # ---- GitHub Actions (workflows) ----
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Asia/Hong_Kong'
      time: '09:30'
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
    labels: ['dependencies', 'ci']

  # ---- Terraform (infra) ----
  - package-ecosystem: 'terraform'
    directories:
      - '/infra/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Asia/Hong_Kong'
      time: '09:45'
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies', 'infra']
